<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCheck — AI Symptom Checker</title>
    <meta name="description" content="AI-powered symptom checker. Describe your symptoms and receive an instant health assessment.">
    <meta name="theme-color" content="#FAFAF7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Ambient background -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- ====== NAVBAR ====== -->
    <header class="navbar">
        <div class="navbar-inner">

            <div class="nav-logo">
                <div class="logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <div class="logo-text-group">
                    <span class="logo-name">HealthCheck</span>
                    <span class="logo-sub" data-i18n="appSubtitle">Medical AI Assistant</span>
                </div>
            </div>

            <div class="nav-actions">

                

                <!-- Language Button -->
                <button class="nav-btn" id="langBtn" aria-label="Change Language">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span data-i18n="langBtn">Language</span>
                    <span id="activeLangFlag" class="lang-flag">🇬🇧</span>
                </button>

                <!-- Nearby Button -->
                <button class="nav-btn nav-btn-accent" id="nearbyBtn" aria-label="Find Nearby Facilities">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span data-i18n="locationBtn">Nearby</span>
                </button>

            </div>
        </div>
    </header>

    <!-- ====== LANGUAGE MODAL ====== -->
    <div class="modal-overlay" id="langModalOverlay" aria-hidden="true">
        <div class="modal lang-modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 class="modal-title" data-i18n="langModalTitle">Select Language</h2>
                <button class="modal-close" id="langModalClose" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="lang-grid">
                <button class="lang-option" data-lang="en">
                    <span class="lang-option-flag">🇬🇧</span>
                    <div class="lang-option-text">
                        <span class="lang-option-native">English</span>
                        <span class="lang-option-name">English</span>
                    </div>
                    <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
                <button class="lang-option" data-lang="hi">
                    <span class="lang-option-flag">🇮🇳</span>
                    <div class="lang-option-text">
                        <span class="lang-option-native">हिन्दी</span>
                        <span class="lang-option-name">Hindi</span>
                    </div>
                    <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
                <button class="lang-option" data-lang="bn">
                    <span class="lang-option-flag">🇮🇳</span>
                    <div class="lang-option-text">
                        <span class="lang-option-native">বাংলা</span>
                        <span class="lang-option-name">Bengali</span>
                    </div>
                    <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
                <button class="lang-option" data-lang="te">
                    <span class="lang-option-flag">🇮🇳</span>
                    <div class="lang-option-text">
                        <span class="lang-option-native">తెలుగు</span>
                        <span class="lang-option-name">Telugu</span>
                    </div>
                    <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
                <button class="lang-option" data-lang="kn">
                    <span class="lang-option-flag">🇮🇳</span>
                    <div class="lang-option-text">
                        <span class="lang-option-native">ಕನ್ನಡ</span>
                        <span class="lang-option-name">Kannada</span>
                    </div>
                    <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
                <button class="lang-option" data-lang="pa">
                    <span class="lang-option-flag">🇮🇳</span>
                    <div class="lang-option-text">
                        <span class="lang-option-native">ਪੰਜਾਬੀ</span>
                        <span class="lang-option-name">Punjabi (Gurmukhi)</span>
                    </div>
                    <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ====== LOCATION MODAL ====== -->
    <div class="modal-overlay" id="locModalOverlay" aria-hidden="true">
        <div class="modal loc-modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" data-i18n="locationTitle">Nearby Medical Facilities</h2>
                    <p class="modal-subtitle" data-i18n="locationSubtitle">Hospitals &amp; Pharmacies within 5 km</p>
                </div>
                <button class="modal-close" id="locModalClose" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div id="locLoading" class="loc-state">
                <div class="loc-spinner"></div>
                <p class="loc-state-msg" id="locLoadingMsg" data-i18n="locating">Getting your location…</p>
            </div>

            <div id="locError" class="loc-state" style="display:none;">
                <div class="loc-error-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="36" height="36">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </div>
                <p class="loc-state-msg" id="locErrorMsg"></p>
                <button class="loc-retry-btn" id="locRetryBtn">Try Again</button>
            </div>

            <div id="locResults" class="loc-results" style="display:none;">
                <div class="loc-section">
                    <div class="loc-section-header">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        <h3 data-i18n="hospitals">Hospitals &amp; Clinics</h3>
                    </div>
                    <div id="hospitalsList" class="facility-list"></div>
                </div>
                <div class="loc-section">
                    <div class="loc-section-header">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                            <line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                        <h3 data-i18n="pharmacies">Pharmacies</h3>
                    </div>
                    <div id="pharmaciesList" class="facility-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== IMAGE TYPE MODAL ====== -->
    <div class="modal-overlay" id="imageTypeOverlay" aria-hidden="true">
        <div class="modal image-type-modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 class="modal-title">What are you uploading?</h2>
                <button class="modal-close" id="imageTypeClose" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="image-type-options">
                <button class="image-type-btn" id="medicineBtnModal" data-type="medicine">
                    <div class="image-type-icon">💊</div>
                    <div class="image-type-label">Medicine Strip/<br>Bottle</div>
                    <div class="image-type-desc">Analyze medicine labels, dates, and info</div>
                </button>
                <button class="image-type-btn" id="diseaseBtnModal" data-type="disease">
                    <div class="image-type-icon">🔍</div>
                    <div class="image-type-label">Skin Condition/<br>Disease</div>
                    <div class="image-type-desc">Analyze skin issues and conditions</div>
                </button>
            </div>
        </div>
    </div>

    <!-- ====== MAIN CHAT ====== -->
    <main class="chat-container" id="chatContainer">
        <div class="chat-messages" id="chatMessages"></div>
    </main>

    <!-- ====== INPUT AREA ====== -->
    <footer class="input-area">
        <div class="input-inner">
            <div class="input-wrapper" id="inputWrapper">
                <!-- Hidden file input -->
                <input type="file" id="imageUpload" accept="image/jpeg,image/png,image/webp" style="display:none">

                <!-- + attach button -->
                <button class="attach-btn" id="attachBtn" title="Upload medicine image" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>

                <div class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <input
                    type="text"
                    id="userInput"
                    data-i18n="symptomPlaceholder"
                    data-i18n-attr="placeholder"
                    placeholder="Describe your symptom…"
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="sendBtn" class="send-btn" title="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
                <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
            </div>

            <div class="followup-buttons" id="followupButtons" style="display:none;">
                <button class="btn-yes" id="btnYes" data-i18n="yes">Yes</button>
                <button class="btn-no"  id="btnNo"  data-i18n="no">No</button>
            </div>

            
        </div>
    </footer>

    <script src="/static/js/translations.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
